name: Build unsigned iOS IPA

on:
  workflow_dispatch:
    inputs:
      flutter_version:
        description: 'Flutter stable version (leave empty for 3.41.5)'
        required: false
        default: ''
      publish_only:
        description: 'Only publish the existing artifact to a Release (skip build)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    if: ${{ !inputs.publish_only }}
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          sw_vers

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version != '' && inputs.flutter_version || '3.41.5' }}
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Resolve Dart dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update

      - name: Build iOS release without code signing
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          set -eux
          APP=build/ios/iphoneos/Runner.app
          test -d "$APP"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry wenku8-unsigned.ipa Payload
          unzip -l wenku8-unsigned.ipa | head -n 20
          ls -lh wenku8-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: wenku8-unsigned-ipa
          path: wenku8-unsigned.ipa
          retention-days: 14
          if-no-files-found: error

  publish:
    if: ${{ inputs.publish_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download IPA artifact from earlier run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          gh run download 44760911467 --repo "$GITHUB_REPOSITORY" --name wenku8-unsigned-ipa --dir out
          ls -la out

      - name: Publish release with IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ipa-0.4.1
          name: Wenku8 Flutter 0.4.1 unsigned IPA
          body: Unsigned iOS IPA built by GitHub Actions. Sign it with Sideloadly / AltStore using your own Apple ID.
          files: out/*.ipa
